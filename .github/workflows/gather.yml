name: Gather brief

# Builds brief/DATE.json for the editor: feeds, prices, earnings and archive state.
# Runs a few minutes after the US market opens (9:30 a.m. New York) so the brief carries opening quotes,
# and about 40 minutes before the editor's scheduled routine. Uses no Claude tokens.
# Cron is UTC, so two hours cover daylight saving: 9:35 a.m. New York is 13:35 UTC in summer and 14:35 in winter.
# With --scheduled, the run before the open and the run after a brief exists stop by themselves.
on:
  schedule:
    - cron: "35 13 * * *" # 9:35 a.m. New York in summer; 8:35 in winter, where Gather stops
    - cron: "35 14 * * *" # 9:35 a.m. New York in winter; 10:35 in summer, where the brief exists and Gather stops
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Apply the scheduled rules: stop before the market opens or when a brief exists. The editor routine sets this."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gather
  cancel-in-progress: false

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the brief
        # --scheduled for the cron runs and for dispatches with scheduled=true (the editor routine's).
        # A plain manual run always builds (unless the edition exists).
        run: mvn -q -f tools/pom.xml -DskipTests compile exec:java -Dexec.mainClass=news.Gather -Dexec.args="--root . ${{ (github.event_name == 'schedule' || inputs.scheduled) && '--scheduled' || '' }}"
      - name: Commit the brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brief
          if git diff --cached --quiet; then
            # Gather leaves the brief alone when that day's edition exists, so nothing staged is legitimate.
            # A Java failure already failed the build step above.
            echo "No brief change to commit."
            exit 0
          fi
          git commit -m "Brief $(TZ=America/Los_Angeles date +%F)"
          git pull --rebase
          git push
