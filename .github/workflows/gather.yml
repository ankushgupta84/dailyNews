name: Gather brief

# Builds brief/DATE.json for the editor: feeds, prices, earnings and archive state.
# Runs an hour before the editor's scheduled routine. Uses no Claude tokens.
on:
  schedule:
    - cron: "35 13 * * *" # 5:35 a.m. Pacific in winter, 6:35 a.m. in summer (cron is UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gather
  cancel-in-progress: false

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the brief
        run: mvn -q -f tools/pom.xml -DskipTests compile exec:java -Dexec.mainClass=news.Gather -Dexec.args="--root ."
      - name: Commit the brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brief
          if git diff --cached --quiet; then
            # Gather leaves the brief alone when that day's edition exists, so nothing staged is legitimate.
            # A Java failure already failed the build step above.
            echo "No brief change to commit."
            exit 0
          fi
          git commit -m "Brief $(TZ=America/Los_Angeles date +%F)"
          git pull --rebase
          git push
